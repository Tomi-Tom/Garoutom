<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Chasseur — le tireur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+French+Canon:ital@0;1&amp;family=IM+Fell+French+Canon+SC&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#666}a:hover{color:#333}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #E8DFCB; background-image: repeating-linear-gradient(90deg, rgba(23,19,15,.05) 0 1px, transparent 1px 40px), repeating-linear-gradient(0deg, rgba(23,19,15,.035) 0 .6px, transparent .6px 3px); font-family: 'Source Serif 4', Georgia, serif; color: #17130F;">

<!-- textures.svg — <defs> collées telles quelles ; puis couvre-chefs et icônes du lot -->
<svg width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
<defs>
  <!-- ============ HACHURES (encre -e, vergé -v) ============ -->
  <!-- H1 claire : pas 6, trait 0,6 — ombres légères, fonds de jeton -->
  <pattern id="hach-1-e" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#17130F" stroke-width="0.6"></line></pattern>
  <pattern id="hach-1-v" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#E8DFCB" stroke-width="0.6"></line></pattern>
  <!-- H2 moyenne : pas 4, trait 0,8 — volumes, bustes -->
  <pattern id="hach-2-e" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#17130F" stroke-width="0.8"></line></pattern>
  <pattern id="hach-2-v" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#E8DFCB" stroke-width="0.8"></line></pattern>
  <!-- H3 serrée : pas 2,6, trait 1,1 — ombres portées gravées, absent -->
  <pattern id="hach-3-e" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2.6" stroke="#17130F" stroke-width="1.1"></line></pattern>
  <pattern id="hach-3-v" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2.6" stroke="#E8DFCB" stroke-width="1.1"></line></pattern>
  <!-- HX croisée : pas 4, trait 0,7, 30° — urgence de la minuterie, absent -->
  <pattern id="hach-x-e" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><path d="M0 0V4M0 0H4" stroke="#17130F" stroke-width="0.7" fill="none"></path></pattern>
  <pattern id="hach-x-v" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><path d="M0 0V4M0 0H4" stroke="#E8DFCB" stroke-width="0.7" fill="none"></path></pattern>
  <!-- HH horizontale : pas 3, trait 0,6 — ciels, bandeaux de décor -->
  <pattern id="hach-h-e" width="6" height="3" patternUnits="userSpaceOnUse"><line x1="0" y1="0.5" x2="6" y2="0.5" stroke="#17130F" stroke-width="0.6"></line></pattern>
  <!-- HV vert du Bataillon (skin Shiganshina seulement) : jamais en aplat -->
  <pattern id="hach-vert" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="3.5" stroke="#45523F" stroke-width="1.3"></line></pattern>
  <!-- Hors vote : rayure horizontale serrée dans le médaillon -->
  <pattern id="hach-barre-e" width="4" height="3" patternUnits="userSpaceOnUse"><line x1="0" y1="1.5" x2="4" y2="1.5" stroke="#17130F" stroke-width="0.9"></line></pattern>

  <!-- ============ PAPIER VERGÉ ============ -->
  <!-- vergeures : 1 trait / 3 px ; pontuseaux : 1 trait / 40 px -->
  <pattern id="verge" width="40" height="3" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0.5" x2="40" y2="0.5" stroke="#17130F" stroke-opacity="0.035" stroke-width="0.6"></line>
    <line x1="0.5" y1="0" x2="0.5" y2="3" stroke="#17130F" stroke-opacity="0.05" stroke-width="1"></line>
  </pattern>

  <!-- ============ GRAINS D'AQUATINTE (4 paliers) ============ -->
  <!-- baseFrequency 0.875 = 224/256 : tuile de 256 px parfaitement raccordée -->
  <!-- Palier I : grain sombre clairsemé sur #A89D8C (opacité 0,18) -->
  <filter id="aqua-I" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.875" numOctaves="2" seed="11" stitchTiles="stitch" result="n"></feTurbulence>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.075  0 0 0 0 0.06  9 0 0 0 -5.6" result="g"></feColorMatrix>
    <feComposite in="g" in2="SourceGraphic" operator="in"></feComposite>
  </filter>
  <!-- Palier II : grain sombre dense sur #7A7064 (opacité 0,22) -->
  <filter id="aqua-II" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.875" numOctaves="2" seed="23" stitchTiles="stitch" result="n"></feTurbulence>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.075  0 0 0 0 0.06  9 0 0 0 -5.2" result="g"></feColorMatrix>
    <feComposite in="g" in2="SourceGraphic" operator="in"></feComposite>
  </filter>
  <!-- Palier III : grain clair (les grains de résine) sur #4A433B (opacité 0,20) -->
  <filter id="aqua-III" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.875" numOctaves="2" seed="37" stitchTiles="stitch" result="n"></feTurbulence>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.91  0 0 0 0 0.875  0 0 0 0 0.796  9 0 0 0 -5.4" result="g"></feColorMatrix>
    <feComposite in="g" in2="SourceGraphic" operator="in"></feComposite>
  </filter>
  <!-- Palier IV : grain clair dense sur #17130F (opacité 0,28) — nuit pleine -->
  <filter id="aqua-IV" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.875" numOctaves="2" seed="41" stitchTiles="stitch" result="n"></feTurbulence>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.91  0 0 0 0 0.875  0 0 0 0 0.796  9 0 0 0 -5.0" result="g"></feColorMatrix>
    <feComposite in="g" in2="SourceGraphic" operator="in"></feComposite>
  </filter>

  <!-- ============ GRAIN DE PAPIER ============ -->
  <filter id="papier" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="2" stitchTiles="stitch"></feTurbulence>
    <feColorMatrix type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.075  0 0 0 0 0.06  1.2 0 0 0 -0.5"></feColorMatrix>
  </filter>

  <!-- ============ TRAIT MORDU (meute) ============ -->
  <!-- grand format (≥ 96 px) ; en dessous, la morsure est DESSINÉE dans le tracé -->
  <filter id="mordu" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
    <feTurbulence type="turbulence" baseFrequency="0.09" numOctaves="2" seed="3" result="t"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="2.6" xChannelSelector="R" yChannelSelector="G" result="d"></feDisplacementMap>
    <feMorphology in="d" operator="dilate" radius="0.35"></feMorphology>
  </filter>
  <filter id="mordu-fin" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
    <feTurbulence type="turbulence" baseFrequency="0.14" numOctaves="1" seed="5" result="t"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="1.2" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
  </filter>

  <!-- ============ CARTOUCHES DE CAMP (viewBox 120×30) ============ -->
  <!-- Village : écu à pans coupés, trait net -->
  <symbol id="cart-ecu" viewBox="0 0 120 30"><path d="M7 1 H113 L119 7 V23 L113 29 H7 L1 23 V7 Z" fill="#F5EFE2" stroke="#17130F" stroke-width="1.5"></path></symbol>
  <!-- Meute : écu mordu à droite -->
  <symbol id="cart-mordu" viewBox="0 0 120 30"><path d="M7 1 H100 L104 6 L109 2 L111 10 L119 13 L112 17 L118 23 L110 25 L106 29 H7 L1 23 V7 Z" fill="#F5EFE2" stroke="#A23B24" stroke-width="2"></path></symbol>
  <!-- Loup Blanc : mordu des deux côtés -->
  <symbol id="cart-mordu2" viewBox="0 0 120 30"><path d="M20 1 H100 L104 6 L109 2 L111 10 L119 13 L112 17 L118 23 L110 25 L106 29 H20 L16 24 L11 28 L9 20 L1 17 L8 13 L2 7 L10 5 L14 1 Z" fill="#F5EFE2" stroke="#A23B24" stroke-width="2"></path></symbol>
  <!-- Serment : lacs (double filet arrondi) -->
  <symbol id="cart-lacs" viewBox="0 0 120 30"><rect x="1.5" y="1.5" width="117" height="27" rx="13.5" fill="#F5EFE2" stroke="#8A3A5C" stroke-width="2"></rect><rect x="5" y="5" width="110" height="20" rx="10" fill="none" stroke="#8A3A5C" stroke-width="0.9"></rect></symbol>
  <!-- Au-delà : écu en pointillé (le village, effacé) -->
  <symbol id="cart-audela" viewBox="0 0 120 30"><path d="M7 1 H113 L119 7 V23 L113 29 H7 L1 23 V7 Z" fill="none" stroke="#5E554A" stroke-width="1.2" stroke-dasharray="1.5 3"></path></symbol>
  <!-- Inconnu : ovale pointillé -->
  <symbol id="cart-ovale" viewBox="0 0 120 30"><ellipse cx="60" cy="15" rx="58" ry="13.5" fill="none" stroke="#5E554A" stroke-width="1.4" stroke-dasharray="3 3"></ellipse></symbol>

  <!-- ============ GLYPHES D'ÉTAT (viewBox 16×16, trait 1,25) ============ -->
  <symbol id="g-sceau" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="#17130F"></circle><path d="M4.5 8.2 L7 10.6 L11.6 5.4" fill="none" stroke="#F5EFE2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></symbol>

  <symbol id="g-horsvote" viewBox="0 0 16 16"><path d="M1.5 5.5 H10 C11 5.5 11 7.5 10 7.5 H6 M10 5.5 C12.5 5.5 14 7 14 9.5 V11 C14 12.8 12.8 14 11 14 H7.5 C6 14 5 13 5 11.5 V7.5" fill="none" stroke="#17130F" stroke-width="1.25" stroke-linejoin="round"></path><path d="M2 14.5 L14.5 2" stroke="#17130F" stroke-width="1.5" stroke-linecap="round"></path></symbol>
  <symbol id="g-chaise" viewBox="0 0 16 16"><path d="M5 1.5 H10 V9 M5 1.5 V15 M5 9 H12.5 M12.5 9 V15 M10 9 V13" fill="none" stroke="#17130F" stroke-width="1.25" stroke-linecap="square"></path></symbol>
  <symbol id="g-index" viewBox="0 0 16 16"><path d="M1.5 5.5 H10 C11 5.5 11 7.5 10 7.5 H6 M10 5.5 C12.5 5.5 14 7 14 9.5 V11 C14 12.8 12.8 14 11 14 H7.5 C6 14 5 13 5 11.5 V7.5 M7.5 10.5 H11.5" fill="none" stroke="#17130F" stroke-width="1.25" stroke-linejoin="round"></path></symbol>
  <symbol id="g-lacs" viewBox="0 0 16 16"><circle cx="6" cy="8" r="4.2" fill="none" stroke="#8A3A5C" stroke-width="1.6"></circle><circle cx="10" cy="8" r="4.2" fill="none" stroke="#8A3A5C" stroke-width="1.6"></circle></symbol>
  <symbol id="g-plume" viewBox="0 0 16 16"><path d="M14 2 C8 3 4 7 2.5 14 M14 2 C13 7 9 11 4 11.5" fill="none" stroke="#17130F" stroke-width="1.25" stroke-linecap="round"></path><path d="M6 9.5 L9 6.5 M7.5 10.5 L10.5 7.5" stroke="#17130F" stroke-width="0.75"></path></symbol>

  <!-- ============ BUSTE DE JETON (exemple : tricorne, siège 1) ============ -->
  <symbol id="buste-tricorne" viewBox="0 0 48 48">
    <path d="M8 48 C9 36 16 31 24 31 C32 31 39 36 40 48 Z" fill="url(#hach-2-e)" stroke="#17130F" stroke-width="1"></path>
    <circle cx="24" cy="21" r="8" fill="url(#hach-1-e)" stroke="#17130F" stroke-width="1"></circle>
    <path d="M10 15 L24 8 L38 15 L33 17 C28 14 20 14 15 17 Z" fill="#17130F"></path>
  </symbol>
  <symbol id="buste-coroza" viewBox="0 0 48 48">
    <path d="M8 48 C9 36 16 31 24 31 C32 31 39 36 40 48 Z" fill="url(#hach-2-e)" stroke="#17130F" stroke-width="1"></path>
    <circle cx="24" cy="22" r="8" fill="url(#hach-1-e)" stroke="#17130F" stroke-width="1"></circle>
    <path d="M17 16 L24 0 L31 16 Z" fill="#17130F"></path>
  </symbol>
  <symbol id="buste-fantome" viewBox="0 0 48 48">
    <path d="M8 48 C9 36 16 31 24 31 C32 31 39 36 40 48" fill="none" stroke="#A89D8C" stroke-width="1"></path>
    <circle cx="24" cy="22" r="8" fill="none" stroke="#A89D8C" stroke-width="1"></circle>
  </symbol>

  <!-- ============ BRUNISSAGE ============ -->
  <!-- masque à bord franc : le rayon avance par crans de 8 px (8, 16, 24…) -->
  <mask id="brunir-demo"><rect x="0" y="0" width="1600" height="1180" fill="#fff"></rect><circle cx="1290" cy="880" r="48" fill="#000"></circle></mask>
</defs>
